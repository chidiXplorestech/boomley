name: Boomley build check

on:
  pull_request:
  push:
    branches:
      - main
      - boomley-50k-rebuild

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build Astro site
        run: npm run build
